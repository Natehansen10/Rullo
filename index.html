<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Rullo is a free indoor cycling app that runs in your browser. Pair your smart trainer and ride. No download, no account." />
    <meta name="theme-color" content="#F5F2EC" />
    <script>
      // The rider's theme, before the first paint, so Dark never opens on a light frame.
      // Keep in step with src/lib/theme.ts: the same key and the same rule. No color is written here.
      try {
        var a = localStorage.getItem('ww.appearance')
        var dark = a === 'dark' || (a === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (dark) document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark')
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Rullo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
